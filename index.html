<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missão Start</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>🚀 Missão Start</h1>

    <p id="mensagem">
      Prepare-se para começar sua missão!
    </p>

    <div class="cartao">
      <p id="afirmacao">
        Sua próxima aventura começa aqui.
      </p>
    </div>

    <p id="etapa">Pronto para começar?</p>

    <div class="botoes">
      <button id="iniciar">Iniciar missão</button>

      <button id="avancar" class="escondido">
        Próxima etapa
      </button>

      <button id="reiniciar" class="escondido">
        Jogar novamente
      </button>
    </div>
  </main>

  <script type="module" src="js/jogo.js"></script>
</body>
</html>
